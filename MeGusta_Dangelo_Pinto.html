<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Social Like</title>
  <link rel="stylesheet" href="MeGusta_Dangelo_Pinto.css">
</head>
<body>

  <header class="topbar">
    <h1>Social Like</h1>
  </header>

  <main class="container">
    <aside class="profile">
      <img src="img/Subaru Natsuki.jpg" alt="Perfil">
      <h2>SuBest</h2>
      <button class="btn-profile">Mi perfil</button>
    </aside>

    <section class="feed">
      <h2>Últimas publicaciones</h2>

      <article>
        <h3>Rei</h3>
        <div class="likes">
          <span><strong class="count">0</strong> like(s)</span>
          <button class="btn-like">Like</button>
        </div>
        <p>Acabo de configurar este nuevo <a href="#">bot de Discord</a>, cuéntame que opinan ustedes.</p>
      </article>

      <article>
        <h3>Asuka</h3>
        <div class="likes">
          <span><strong class="count">0</strong> like(s)</span>
          <button class="btn-like">Like</button>
        </div>
        <p>Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.</p>
      </article>

      <article>
        <h3>Shinji</h3>
        <div class="likes">
          <span><strong class="count">0</strong> like(s)</span>
          <button class="btn-like">Like</button>
        </div>
        <p>No puedo dejar de escuchar este <a href="#">album</a>. ¿A quién más le gusta?</p>
      </article>
    </section>
  </main>

  <script src="MeGusta_Dangelo_Pinto.js"></script>
</body>
</html>
